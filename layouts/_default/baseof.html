
<!DOCTYPE html>
<html lang="de-AT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>

    <style>


        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111820;
            color: #f5f5f5;
            line-height: 1.6;
        }

        .site-header {
            background: #080808;
            padding: 16px 24px;
            border-bottom: 3px solid #d62828;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
            color: #fff;
            text-decoration: none;
        }

        .site-logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
        }

        .brand-text strong {
            font-size: 1.8rem;
            letter-spacing: 3px;
        }

        .brand-text span {
            color: #ccc;
            font-size: 0.9rem;
        }

        .main-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 22px;
        }

        .main-nav a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
        }

        .main-nav a:hover {
            color: #ff4545;
        }

        main {
            max-width: 850px;
            margin: 60px auto;
            padding: 0 24px;
            min-height: 45vh;
        }

        h1, h2 {
            color: #fff;
        }

        a {
            color: #ff4545;
        }

        .hero {
            position: relative;
            overflow: hidden;
            min-height: 420px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 48px;
            box-sizing: border-box;
            background:
                linear-gradient(
                    90deg,
                    rgba(0, 0, 0, 0.88),
                    rgba(0, 0, 0, 0.25)
                ),
                
                url('{{ "images/bernd.jpg" | relURL }}') center/cover no-repeat;
            border-bottom: 3px solid #d62828;
            border-radius: 6px;
        }

        .hero-label {
            color: #ff4545;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .hero h2 {
            font-size: clamp(2.8rem, 7vw, 5rem);
            line-height: 1.05;
            margin: 24px 0;
            letter-spacing: -2px;
        }

        .hero-text {
            color: #ccc;
            font-size: 1.15rem;
            max-width: 600px;
        }

        .hero-button {
            display: inline-block;
            background: #d62828;
            color: #fff;
            text-decoration: none;
            padding: 14px 24px;
            font-weight: bold;
            border-radius: 4px;
            border: 1px solid #ff4545;
        }

        .hero-button:hover {
            background: #a91f1f;
            color: #fff;
        }

        @media (max-width: 600px) {
            .hero {
                min-height: 380px;
                padding: 24px;
            }
        }


        footer {
            text-align: center;
            padding: 24px;
            color: #aaa;
            border-top: 1px solid #333;
        }

        @media (max-width: 600px) {
            .site-header {
                justify-content: center;
            }

            .main-nav {
                justify-content: center;
                gap: 14px;
            }

            .brand-text span {
                font-size: 0.75rem;
            }
        }

        /* Mitgliederfotos */
        main img {
            max-width: 100%;
            height: auto;
        }

        main img[alt*="Bernd"],
        main img[alt*="Gerald"] {
            width: 220px;
            height: 220px;
            object-fit: cover;
            object-position: center;
            border-radius: 8px;
            display: block;
            margin: 16px 0;
        }

    </style>
</head>

<body>
    <header class="site-header">
        <a href='{{ "" | relURL }}' class="brand">
            <img src='{{ "images/logo.jpg" | relURL }}'
                 alt="SATA – Sauna Aufguss Team Austria"
                 class="site-logo">

            <span class="brand-text">
                <strong>SATA</strong>
                <span>Sauna Aufguss Team Austria</span>
            </span>
        </a>

        <nav class="main-nav">
            <a href="{{ "" | relURL }}">Startseite</a>
            <a href='{{ "termine/" | relURL }}'>Termine</a>
            <a href="{{ "mitglieder/" | relURL }}">Mitglieder</a>
            <a href="{{ "sponsoren/" | relURL }}">Sponsoren</a>
            <a href="{{ "kontakt/" | relURL }}">Kontakt</a>
        </nav>
    </header>

    <main>
        {{ block "main" . }}{{ end }}
    </main>

    <footer>
        &copy; {{ now.Year }} SATA – Sauna Aufguss Team Austria
    </footer>
</body>
</html>
